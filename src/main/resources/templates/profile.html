<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>User Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root {
    --bg-main: #0f172a;
    --bg-card: #111827;
    --border: #1f2937;
    --text-main: #e5e7eb;
    --text-muted: #9ca3af;
    --accent: #38bdf8;
}

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(circle at top, #1e293b, var(--bg-main));
    color: var(--text-main);
    padding: 30px;
}

.container {
    max-width: 900px;
    margin: auto;
}

.profile-card,
.booking-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
}

.title {
    font-size: 2rem;
    margin-bottom: 16px;
    color: var(--accent);
}

.detail {
    margin: 10px 0;
    color: var(--text-muted);
}

.detail span {
    color: var(--text-main);
    font-weight: 700;
}

.heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
}

.heading h2 {
    margin: 0;
}

.empty {
    font-size: 1rem;
    color: var(--text-muted);
}

.booking-card h3 {
    color: var(--accent);
    margin-bottom: 12px;
}

.booking-detail {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 14px;
}

.badge {
    display: inline-block;
    background: #22c55e;
    color: #fff;
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 0.85rem;
    font-weight: 700;
}

a.button-link {
    display: inline-block;
    margin-top: 10px;
    padding: 10px 18px;
    border-radius: 12px;
    background: linear-gradient(135deg, #38bdf8, #0ea5e9);
    color: white;
    text-decoration: none;
    font-weight: 700;
}
</style>
</head>
<body>

<div class="container">
    <div class="profile-card">
        <div class="heading">
            <div>
                <div class="title">👤 My Profile</div>
                <p class="detail">Welcome back, <span th:text="${user.name}"></span></p>
            </div>
        </div>
        <p class="detail">Email: <span th:text="${user.email}"></span></p>
        <p class="detail">Phone: <span th:text="${user.phone}"></span></p>
        <p class="detail">Role: <span th:text="${user.role}"></span></p>
    </div>

    <div class="profile-card">
        <div class="heading">
            <h2>🎟️ Recent Bookings</h2>
            <a class="button-link" th:href="@{/bookings}">View All Bookings</a>
        </div>

        <p class="empty" th:if="${#lists.isEmpty(bookings)}">
            No bookings found yet.
        </p>

        <div th:each="booking : ${bookings}" class="booking-card">
            <h3 th:text="${booking.movieName}">Movie Name</h3>
            <div class="booking-detail">
                <div>
                    <span class="detail">Date:</span>
                    <span th:text="${booking.date}"></span>
                </div>
                <div>
                    <span class="detail">Seats:</span>
                    <span th:text="${booking.seats}"></span>
                </div>
            </div>
            <div class="booking-detail">
                <div>
                    <span class="detail">Total Paid:</span>
                    <span>₹<span th:text="${booking.totalAmount}"></span></span>
                </div>
                <div>
                    <span class="detail">Status:</span>
                    <span class="badge">Confirmed</span>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
